<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quickzi Riders</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e4e3df;
    --red: #c8322b; --red-bg: #fdecea; --amber: #b86e00; --amber-bg: #fff4e0;
    --slate: #4b5563; --slate-bg: #eef0f3; --green: #1f7a45; --green-bg: #e7f4ec;
    --accent: #7c4dff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1d1d1b; --ink: #ecebe7; --muted: #9a9993; --line: #2e2e2b;
      --red: #ff6b61; --red-bg: #3a1a18; --amber: #f2a93b; --amber-bg: #372a13;
      --slate: #b7bec9; --slate-bg: #262a30; --green: #5fd08f; --green-bg: #15301f;
      --accent: #a98bff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block;
         margin-right: 6px; }
  .dot.stale { background: var(--red); }
  .updated { color: var(--muted); font-size: 12px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
           border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
  .count { background: var(--red); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; }
  .count.zero { background: var(--green); }
  .cards { display: grid; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--red);
          border-radius: 10px; padding: 12px; }
  .card.late { border-left-color: var(--red); }
  .card.stationary { border-left-color: var(--amber); }
  .card.gps { border-left-color: var(--slate); }
  .card.ptod, .card.off_route { border-left-color: var(--red); }
  .card.wait { border-left-color: var(--amber); }
  .card.resolved { border-left-color: var(--green); opacity: .7; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
         letter-spacing: .04em; border-radius: 5px; padding: 1px 6px; margin-right: 6px; }
  .tag.late { background: var(--red-bg); color: var(--red); }
  .tag.stationary { background: var(--amber-bg); color: var(--amber); }
  .tag.gps { background: var(--slate-bg); color: var(--slate); }
  .tag.ptod, .tag.off_route { background: var(--red-bg); color: var(--red); }
  .tag.wait { background: var(--amber-bg); color: var(--amber); }
  .tag.resolved { background: var(--green-bg); color: var(--green); }
  .headline { font-weight: 600; margin: 6px 0 4px; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions a { text-decoration: none; font-size: 13px; font-weight: 600; color: var(--accent);
               border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 18px;
           color: var(--muted); text-align: center; }
  .st { font-size: 12px; font-weight: 600; border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
  .st.go { background: var(--slate-bg); color: var(--slate); }
  .st.wait { background: var(--amber-bg); color: var(--amber); }
  .st.drive { background: var(--green-bg); color: var(--green); }
  .mins.warn { color: var(--amber); font-weight: 700; } .mins.bad { color: var(--red); font-weight: 700; }
  tr.issue td:first-child { box-shadow: inset 3px 0 var(--red); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 12px; }
  .seg button.active { background: var(--ink); color: var(--bg); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.rider { cursor: pointer; }
  tr.rider:hover td { background: var(--bg); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 4px; min-width: 50px; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--green); }
  .bar i.mid { background: var(--amber); } .bar i.low { background: var(--red); }
  .hide-sm { }
  @media (max-width: 560px) { .hide-sm { display: none; } th, td { padding: 9px 6px; } }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
           width: min(640px, calc(100vw - 32px)); max-height: 80vh; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg-head { position: sticky; top: 0; background: var(--card); padding: 14px 16px;
              border-bottom: 1px solid var(--line); display: flex; align-items: center; }
  .dlg-head h3 { margin: 0; flex: 1; font-size: 16px; }
  .dlg-body { padding: 12px 16px 16px; display: grid; gap: 8px; }
</style>
</head>
<body>
<header>
  <h1>Quickzi · Munich riders</h1>
  <span class="updated"><span id="dot" class="dot"></span><span id="updated">loading…</span></span>
  <button id="sound" title="Play a sound on new alerts">🔇 Sound off</button>
</header>
<main>
  <h2>Live alerts <span id="openCount" class="count zero">0</span></h2>
  <div id="live" class="cards"></div>

  <h2>Running orders <span id="activeCount" class="count zero">0</span>
    <span id="unassigned" style="text-transform:none;letter-spacing:0;font-weight:400"></span></h2>
  <div id="active"></div>

  <h2 style="justify-content:space-between">
    <span>Rider performance</span>
    <span class="seg" id="periods">
      <button data-p="today" class="active">Today</button>
      <button data-p="week">Week</button>
      <button data-p="month">Month</button>
    </span>
  </h2>
  <div id="perf"></div>
</main>

<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlgTitle">Rider</h3><button id="dlgClose">Close</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<script>
const KIND = { ptod: "PTOD", late: "Late", off_route: "Wrong way", wait: "Waiting", stationary: "Not moving", gps: "No GPS" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hm = iso => iso ? new Date(iso).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit", timeZone:"Europe/Berlin"}) : "";
const dayhm = iso => iso ? new Date(iso).toLocaleString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit", timeZone:"Europe/Berlin"}) : "";
const mins = (a, b) => Math.max(0, Math.round((new Date(b || Date.now()) - new Date(a)) / 60000));

let period = "today", soundOn = false, known = null, audio;

function beep() {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.2, audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + t + 0.2);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.2);
    });
  } catch (e) {}
}

function card(i) {
  const resolved = !!i.resolved_at;
  const cls = resolved ? "resolved" : i.kind;
  const tag = resolved ? `<span class="tag resolved">Resolved</span><span class="tag ${i.kind}">${KIND[i.kind]}</span>`
                       : `<span class="tag ${i.kind}">${KIND[i.kind] || i.kind}</span>`;
  const head = resolved ? `${esc(i.resolution)} · lasted ${mins(i.opened_at, i.resolved_at)} min` : esc(i.headline);
  const meta = [
    `<span>👤 <b>${esc(i.rider)}</b></span>`,
    i.order_ref ? `<span>📦 ${esc(i.order_ref)}</span>` : "",
    i.address ? `<span>📍 ${esc(i.address)}</span>` : "",
    i.due ? `<span>🕒 due ${hm(i.due)}</span>` : "",
    `<span>since ${hm(i.opened_at)}</span>`,
  ].join("");
  const acts = resolved ? "" : [
    i.phone ? `<a href="tel:${esc(i.phone.replace(/\s/g, ""))}">📞 Call</a>` : "",
    i.phone ? `<a href="https://wa.me/${esc(i.phone.replace(/[^\d]/g, ""))}" target="_blank" rel="noopener">WhatsApp</a>` : "",
    i.map_url ? `<a href="${esc(i.map_url)}" target="_blank" rel="noopener">🗺 Map</a>` : "",
  ].join("");
  return `<div class="card ${cls}">${tag}<div class="headline">${head}</div><div class="meta">${meta}</div>${acts ? `<div class="actions">${acts}</div>` : ""}</div>`;
}

async function get(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function loadLive() {
  const { incidents } = await get("/api/live");
  const open = incidents.filter(i => !i.resolved_at);
  const cnt = document.getElementById("openCount");
  cnt.textContent = open.length; cnt.className = "count" + (open.length ? "" : " zero");
  document.getElementById("live").innerHTML = incidents.length ? incidents.map(card).join("")
    : `<div class="empty">✅ All riders on track — no problems right now.</div>`;
  const ids = new Set(open.map(i => i.id));
  if (known && [...ids].some(id => !known.has(id))) beep();
  known = ids;
  document.title = open.length ? `(${open.length}) Quickzi Riders` : "Quickzi Riders";
}

async function loadPerf() {
  const { riders } = await get(`/api/performance?period=${period}`);
  if (!riders.length) {
    document.getElementById("perf").innerHTML = `<div class="empty">No Munich deliveries recorded for this period yet.</div>`;
    return;
  }
  const rows = riders.map((r, n) => {
    const pct = r.on_time_pct;
    const lvl = pct == null ? "" : pct >= 90 ? "" : pct >= 75 ? "mid" : "low";
    return `<tr class="rider" data-id="${esc(r.driver_id)}" data-name="${esc(r.rider)}">
      <td class="num">${n + 1}</td>
      <td><b>${esc(r.rider)}</b></td>
      <td class="num">${r.deliveries}</td>
      <td class="num">${pct == null ? "–" : pct + "%"}<div class="bar"><i class="${lvl}" style="width:${pct || 0}%"></i></div></td>
      <td class="num">${r.avg_ptod == null ? "–" : r.avg_ptod + "′"}</td>
      <td class="num">${r.issues || "·"}</td>
      <td class="num hide-sm">${r.off_route || "·"}</td>
      <td class="num hide-sm">${r.wait || "·"}</td>
      <td class="num hide-sm">${r.stationary || "·"}</td>
      <td class="num hide-sm">${r.gps || "·"}</td>
    </tr>`;
  }).join("");
  document.getElementById("perf").innerHTML = `<table>
    <thead><tr><th class="num">#</th><th>Rider</th><th class="num">Deliv.</th><th class="num">≤30 min</th>
    <th class="num">Avg PTOD</th><th class="num">Alerts</th><th class="num hide-sm">Wrong way</th>
    <th class="num hide-sm">Waiting</th><th class="num hide-sm">Stopped</th><th class="num hide-sm">No GPS</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

async function loadActive() {
  const { orders, unassigned } = await get("/api/active");
  const c = document.getElementById("activeCount");
  c.textContent = orders.length; c.className = "count zero";
  document.getElementById("unassigned").textContent = unassigned ? `· ${unassigned} waiting for a rider` : "";
  if (!orders.length) {
    document.getElementById("active").innerHTML = `<div class="empty">No orders in progress right now. They appear here as soon as MotionTools reports them.</div>`;
    return;
  }
  const cls = s => s.startsWith("At") ? "wait" : s === "Going to restaurant" ? "go" : "drive";
  const rows = orders.map(o => {
    const m = o.minutes, mc = m == null ? "" : m >= 30 ? "bad" : m >= 25 ? "warn" : "";
    return `<tr class="${o.has_issue ? "issue" : ""}">
      <td><b>${esc(o.rider)}</b>${o.phone ? `<br><a href="tel:${esc(o.phone.replace(/\s/g, ""))}" style="font-size:12px;color:var(--accent)">📞 call</a>` : ""}</td>
      <td>${esc(o.order_ref)}</td>
      <td><span class="st ${cls(o.status)}">${esc(o.status)}</span></td>
      <td class="num mins ${mc}">${m == null ? "–" : m + "′"}</td>
      <td class="num hide-sm">${o.eta ? hm(o.eta) : "–"}</td></tr>`;
  }).join("");
  document.getElementById("active").innerHTML = `<table><thead><tr><th>Rider</th><th>Order</th><th>Status</th>
    <th class="num">PTOD</th><th class="num hide-sm">ETA</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function openRider(id, name) {
  document.getElementById("dlgTitle").textContent = `${name} — last 30 days`;
  const body = document.getElementById("dlgBody");
  body.innerHTML = "Loading…";
  document.getElementById("dlg").showModal();
  const { incidents } = await get(`/api/rider/${encodeURIComponent(id)}`);
  body.innerHTML = incidents.length ? incidents.map(i => `<div class="card ${i.kind}">
      <span class="tag ${i.kind}">${KIND[i.kind] || i.kind}</span>
      <div class="headline">${esc(i.headline)}</div>
      <div class="meta"><span>${dayhm(i.opened_at)}</span>
        ${i.order_ref ? `<span>📦 ${esc(i.order_ref)}</span>` : ""}
        ${i.address ? `<span>📍 ${esc(i.address)}</span>` : ""}
        ${i.resolved_at ? `<span>✅ ${esc(i.resolution)} after ${mins(i.opened_at, i.resolved_at)} min</span>` : "<span>still open</span>"}
        ${i.map_url ? `<a href="${esc(i.map_url)}" target="_blank" rel="noopener">map</a>` : ""}</div></div>`).join("")
    : `<div class="empty">No incidents in the last 30 days 👍</div>`;
}

async function refresh() {
  try {
    await Promise.all([loadLive(), loadActive(), loadPerf()]);
    document.getElementById("dot").className = "dot";
    document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
  } catch (e) {
    document.getElementById("dot").className = "dot stale";
    document.getElementById("updated").textContent = "connection problem — retrying";
  }
}

document.getElementById("periods").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  period = b.dataset.p;
  document.querySelectorAll("#periods button").forEach(x => x.classList.toggle("active", x === b));
  loadPerf().catch(() => {});
});
document.getElementById("perf").addEventListener("click", e => {
  const tr = e.target.closest("tr.rider"); if (tr) openRider(tr.dataset.id, tr.dataset.name).catch(() => {});
});
document.getElementById("dlgClose").onclick = () => document.getElementById("dlg").close();
document.getElementById("sound").onclick = e => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? "🔔 Sound on" : "🔇 Sound off";
  e.target.classList.toggle("on", soundOn);
  if (soundOn) beep();
};

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
